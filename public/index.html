<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixbit Solutions - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pixbit-gold: #FFD700;
      --bg-dark: #050505;
      --card-bg: #0A0A0A;
      --border-gold: rgba(255, 215, 0, 0.3);
      --border-gold-hover: rgba(255, 215, 0, 0.8);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      /* Add subtle diagonal mesh lines */
      background-image: 
        linear-gradient(45deg, rgba(255,215,0,0.03) 1px, transparent 1px),
        linear-gradient(-45deg, rgba(255,215,0,0.03) 1px, transparent 1px);
      background-size: 150px 150px;
      background-position: center center;
      background-attachment: fixed;
    }

    /* Pill-shaped navbar */
    .floating-nav {
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-gold);
      border-radius: 9999px; /* Pill shape */
      padding: 0.5rem 1rem;
      max-width: 900px;
      margin: 2rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Primary gold text highlight */
    .text-gold {
      color: var(--pixbit-gold);
    }

    /* Outline buttons (Capsules) */
    .btn-outline {
      border: 1px solid var(--border-gold);
      border-radius: 9999px;
      padding: 0.5rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.3s ease;
      background: transparent;
      color: white;
    }
    
    .btn-outline:hover {
      border-color: var(--pixbit-gold);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    /* Cards with highly rounded corners */
    .pixbit-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 32px;
      padding: 2rem;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .pixbit-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at top right, rgba(255,215,0,0.05), transparent 60%);
      pointer-events: none;
    }

    .pixbit-card:hover {
      border-color: var(--border-gold-hover);
      box-shadow: 0 10px 40px -10px rgba(255, 215, 0, 0.15);
      transform: translateY(-4px);
    }

    /* Small pill tag */
    .pill-tag {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--border-gold);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      color: var(--pixbit-gold);
      display: inline-block;
    }

    /* Typography */
    h1 {
      font-size: 4rem;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; }
    }

    /* Modal Styles */
    #chat-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    .chat-bubble {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 16px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .chat-user {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--pixbit-gold);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .chat-bot {
      background: #111;
      border: 1px solid #333;
      color: #eee;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen">

  <main class="max-w-7xl mx-auto px-6 py-12">
    
    <!-- Hero Section -->
    <div class="mb-20">
      <div class="pill-tag mb-6">Pixbit Dashboard</div>
      <h1 class="mb-6">
        Client <span class="text-gold">Enquiries</span><br>
        Management System
      </h1>
      <p class="text-gray-400 max-w-xl text-lg leading-relaxed mb-8">
        Track incoming leads and manage client project requirements seamlessly in real-time.
      </p>
      
      <!-- Live Stats -->
      <div class="flex space-x-6">
        <div class="flex items-center space-x-3">
          <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
          <span class="text-sm font-medium text-gray-300">System Online</span>
        </div>
        <div class="flex items-center space-x-3">
          <span class="text-sm text-gray-400">Total Leads:</span>
          <span class="text-gold font-bold text-xl" id="total-count">0</span>
        </div>
      </div>
    </div>

    <!-- Enquiries Grid -->
    <div id="enquiries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Inquiries will be injected here -->
      <div class="col-span-full text-center py-20 text-gray-500" id="loading">
        Loading inquiries...
      </div>
    </div>

  </main>

  <!-- Chat Modal Overlay -->
  <div id="chat-modal" class="flex">
    <div class="pixbit-card w-full max-w-2xl max-h-[80vh] flex flex-col mx-4 p-0">
      <div class="p-6 border-b border-[rgba(255,215,0,0.2)] flex justify-between items-center bg-[#0A0A0A] z-10 rounded-t-[32px]">
        <h3 class="text-xl font-semibold">Chat History</h3>
        <button onclick="closeChatModal()" class="text-gray-400 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div id="chat-messages-container" class="p-6 overflow-y-auto flex-1 flex flex-col space-y-2 bg-[#050505] rounded-b-[32px]">
        <!-- Messages injected here -->
      </div>
    </div>
  </div>

  <script>
    async function loadEnquiries() {
      try {
        const response = await fetch('/api/enquiries');
        const data = await response.json();
        
        document.getElementById('total-count').textContent = data.length;
        const grid = document.getElementById('enquiries-grid');
        grid.innerHTML = '';

        if (data.length === 0) {
          grid.innerHTML = '<div class="col-span-full text-center py-20 border border-dashed border-[rgba(255,215,0,0.2)] rounded-[32px] text-gray-500">No client enquiries found. Awaiting incoming leads...</div>';
          return;
        }

        data.forEach(enq => {
          const date = new Date(enq.updated_at).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          });
          
          const card = document.createElement('div');
          card.className = 'pixbit-card flex flex-col h-full';
          
          card.innerHTML = `
            <div class="flex justify-between items-start mb-6">
              <div class="pill-tag">${enq.service || 'Unknown'}</div>
              <span class="text-xs text-gray-500 font-medium">${date}</span>
            </div>
            
            <div class="mb-8">
              <h3 class="text-2xl font-semibold text-white mb-2">${enq.name || 'Anonymous'}</h3>
              <p class="text-gold text-sm">${enq.contact || 'No contact yet'}</p>
              ${enq.meeting_time ? `<div class="mt-3 inline-block bg-green-500/10 border border-green-500/30 text-green-400 text-xs px-3 py-1 rounded-full animate-pulse">📅 Meeting: ${enq.meeting_time}</div>` : ''}
            </div>
            
            <div class="mt-auto">
              <h4 class="text-xs text-gray-500 uppercase tracking-widest font-semibold mb-3">AI Insights & Notes</h4>
              <div class="text-gray-300 text-sm leading-relaxed border-t border-[rgba(255,215,0,0.1)] pt-4 whitespace-pre-wrap mb-4">${enq.insights || 'No insights gathered yet.'}</div>
              <button onclick="openChatModal('${enq.chat_id}')" class="btn-outline w-full mt-2 py-2 text-xs hover:bg-[rgba(255,215,0,0.1)]">View Chat History</button>
            </div>
          `;
          
          grid.appendChild(card);
        });

      } catch (err) {
        console.error('Error fetching inquiries:', err);
        document.getElementById('enquiries-grid').innerHTML = 
          '<div class="col-span-full text-center py-12 text-red-400">Failed to load inquiries.</div>';
      }
    }

    loadEnquiries();
    
    // Refresh every 5 seconds
    setInterval(loadEnquiries, 5000);

    async function openChatModal(chatId) {
      const modal = document.getElementById('chat-modal');
      const container = document.getElementById('chat-messages-container');
      modal.style.display = 'flex';
      container.innerHTML = '<div class="text-center text-gray-500 py-10">Loading messages...</div>';
      
      try {
        const response = await fetch(`/api/messages/${chatId}`);
        const messages = await response.json();
        
        if (messages.length === 0) {
          container.innerHTML = '<div class="text-center text-gray-500 py-10">No messages found.</div>';
          return;
        }

        container.innerHTML = '';
        messages.forEach(msg => {
          const div = document.createElement('div');
          const isUser = msg.role === 'user';
          div.className = `chat-bubble ${isUser ? 'chat-user' : 'chat-bot'} flex flex-col`;
          
          const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          div.innerHTML = `
            <span>${msg.content}</span>
            <span class="text-[10px] opacity-50 mt-1 ${isUser ? 'text-right' : 'text-left'}">${time}</span>
          `;
          container.appendChild(div);
        });
        
        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
      } catch (e) {
        container.innerHTML = '<div class="text-center text-red-500 py-10">Error loading messages.</div>';
      }
    }

    function closeChatModal() {
      document.getElementById('chat-modal').style.display = 'none';
    }
  </script>
</body>
</html>
